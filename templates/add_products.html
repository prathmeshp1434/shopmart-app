<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Add New Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .form-container { max-width: 400px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .back-link { display: block; margin-top: 15px; text-align: center; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>➕ Add New Product</h2>
    
    <!-- POST Method: Browser se secure data bhejne ke liye -->
    <form action="/add_product" method="POST">
        <label>Product image link(URL):</lable>
        <input type="url" name="image_url" placeholder="paste link here" class="form-control">
        
        <label>Product Name:</label>
        <input type="text" name="name" placeholder="e.g. Wireless Mouse" required>

        <label>Price (₹):</label>
        <input type="number" step="0.01" name="price" placeholder="e.g. 499.00" required>

        <label>Stock Quantity:</label>
        <input type="number" name="stock" value="1" min="1" required>

        <label>Category:</label>
        <select name="category_id" required>
            <option value="">Select a Category</option>
            
            {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Save Product to DB</button>
    </form>

    <a href="/" class="back-link">← Back to Products List</a>
</div>

</body>
</html>
