{% extends 'products.html' %}

{% block content %}
<style>
    /* Teri banayi hui custom styling */
    .success-card {
        max-width: 480px;
        margin: 40px auto;
        padding: 35px 25px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        text-align: center;
        font-family: Arial, sans-serif;
    }

    .btn-shop-more {
        display: block;
        width: 100%;
        background-color: #2874f0;
        color: #ffffff;
        padding: 13px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(40, 116, 240, 0.25);
        box-sizing: border-box;
        margin-top: 20px;
        transition: background 0.2s ease;
    }

    .btn-shop-more:hover {
        background-color: #1259cc;
        color: white;
    }
</style>

<div class="success-card">
    <div style="font-size: 50px; margin-bottom: 10px;">🛒</div>
    <h2 style="color: #2874f0; margin-bottom: 5px; font-size: 22px;">Finalize Your Order</h2>
    <p style="color: #666; font-size: 14px; margin-top: 0;">Click below to pay securely through Razorpay.</p>

    <!-- Teri custom CSS class wala Pay Now button -->
    <button id="pay-btn" class="btn-shop-more">💳 Pay Securely Now</button>
</div>

<!-- 1. Razorpay ki official Checkout Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<!-- 2. Dynamic Payment JavaScript Logic -->
<script>
    document.getElementById('pay-btn').onclick = async function (e) {
        e.preventDefault();

        try {
            // Backend ke naye order creation route par request bhejo
            const response = await fetch('/create-order', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error || "Kuch gadbad ho gayi bhai!");
                return;
            }

            // Razorpay Options Set Karo
            var options = {
                "key": data.key,                 // Backend se aayi key
                "amount": data.amount,           // Backend se aaya dynamic amount (Paise me)
                "currency": "INR",
                "name": "Shopmart Store",
                "description": "E-Commerce Order Payment",
                "order_id": data.order_id,       // Backend se aayi unique Order ID
                "handler": function (response){
                    // Payment successful hone par, success page par redirect karo 
                    // aur payment_id sath me bhejo taaki success page par dikha sakein
                    window.location.href = "/order-success?payment_id=" + response.razorpay_payment_id + "&order_id=" + data.order_id;
                },
                "prefill": {
                    "name": "Prathmesh Pawar",
                    "email": "user@example.com",
                    "contact": "9999999999"
                },
                "theme": {
                    "color": "#2874f0"
                }
            };

            // Razorpay Popup Open karo
            var rzp1 = new Razorpay(options);
            
            rzp1.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
            });

            rzp1.open();

        } catch (error) {
            console.error("Error:", error);
            alert("Server se connect karne me dikkat aa rahi hai bhai.");
        }
    }
</script>
{% endblock %}
