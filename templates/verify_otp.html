{% extends 'products.html' %}
{% block content %}
<div style="max-width: 350px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>🔑 Enter OTP</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form action="/verify-otp" method="POST">
        <label>Enter 6-digit OTP:</label><br><br>
        <input type="text" name="otp" maxlength="6" placeholder="123456" required style="width: 100%; padding: 8px;"><br><br>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #388e3c; color: white; border: none; border-radius: 4px;">Verify & Login</button>
    </form>
</div>
{% endblock %}
